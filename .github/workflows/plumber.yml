name: Plumber

# CI/CD security scan of this repository's workflows (see .plumber.yaml,
# docs/DECISIONS.md #18). Findings are uploaded to Code Scanning (SARIF) and
# the Plumber Score is published as a public badge (score-push), which is
# why the job needs security-events: write and id-token: write.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plumber:
    name: CI/CD security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to Code Scanning
      id-token: write # OIDC for the hosted score badge (score-push)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      # The one deliberate third-party action in this repository (allowed
      # in .plumber.yaml): SHA-pinned to the release matching the mise.toml
      # pin, and the binary it installs is verified against checksums.txt
      # and its SLSA build-provenance attestation.
      - uses: getplumber/plumber@669507c3cc8282406ae58816823fd84a32752633 # v0.6.4
        with:
          version: v0.6.4 # follows the mise.toml pin
          # Gate at 90 points: a PR whose Plumber Score drops below 90 fails
          # the job (required status check on main, docs/DECISIONS.md D-006).
          # The repo currently scores 100/100 — a PR that degrades it to
          # 90–99 passes, anything lower is blocked.
          min-points: "90"
          score-push: true # publishes the live badge for the README
