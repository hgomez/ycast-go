name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (node24)
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # Official binary release, sha256-pinned (no third-party action per the
      # project security policy). Version follows mise.toml.
      - name: golangci-lint
        run: |
          curl -sfL -o gcl.tar.gz \
            https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
          echo 'ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  gcl.tar.gz' | sha256sum -c -
          tar -xzf gcl.tar.gz
          ./golangci-lint-2.14.0-linux-amd64/golangci-lint run ./...
      - name: go test
        run: go test -race -count=1 ./...

  cross-build:
    name: Cross-compile smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (node24)
        with:
          go-version-file: go.mod
      - name: Build arm64 and armv7
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/ycast-go-arm64 ./cmd/ycast-go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /tmp/ycast-go-armv7 ./cmd/ycast-go
