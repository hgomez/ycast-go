name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: Cross-compiled binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0 # git describe for the version string
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (node24)
        with:
          go-version-file: go.mod
      - name: Build all targets
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: binaries
          path: dist/ycast-go-linux-*

  deb:
    name: Debian package (amd64)
    runs-on: ubuntu-latest
    container: debian:trixie-20261005@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5 # debian:trixie-20261005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git dpkg-dev debhelper build-essential golang-any
      - name: Build the package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp -r packaging/deb/debian .
          sed -i "1s/ycast-go (.*)/ycast-go (${VERSION})/" debian/changelog
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../ycast-go_*.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: RPM package (x86_64)
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 # fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: dnf install -y go rpm-build git-core systemd-rpm-macros
      - name: Build the package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:        .*/Version:        ${VERSION}/" packaging/rpm/ycast-go.spec
          rpmbuild_topdir="$PWD/rpmbuild"
          mkdir -p "$rpmbuild_topdir"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar czf "$rpmbuild_topdir/SOURCES/ycast-go-${VERSION}.tar.gz" \
              --transform "s,^,ycast-go-${VERSION}/," \
              --exclude=.git --exclude=dist --exclude=rpmbuild .
          cp packaging/rpm/ycast-go.spec "$rpmbuild_topdir/SPECS/"
          rpmbuild -bb --define "_topdir $rpmbuild_topdir" \
              "$rpmbuild_topdir/SPECS/ycast-go.spec"
          mkdir -p dist
          mv "$rpmbuild_topdir"/RPMS/*/*.rpm dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: rpm
          path: dist/*.rpm

  # OpenWrt packages, built with the official SDKs (packaging/openwrt/).
  # 24.10 uses opkg (.ipk); the .apk format (apk-tools) is the 25.x
  # generation. Both SDK versions are pinned (with sha256 verification at
  # download time). arm32 arch is arm_cortex-a15_neon-vfpv4 (generic
  # armsr/armv7 target); other ARM sub-archs rebuild from the same sources
  # with the matching SDK (see packaging/openwrt/README.md).
  openwrt:
    name: OpenWrt package (${{ matrix.version }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "24.10.8", target: "armsr/armv8", ext: ipk }
          - { version: "24.10.8", target: "armsr/armv7", ext: ipk }
          - { version: "25.12.5", target: "armsr/armv8", ext: apk }
          - { version: "25.12.5", target: "armsr/armv7", ext: apk }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Download and verify the SDK
        run: |
          base="https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/${{ matrix.target }}"
          sdk=$(curl -sf "$base/" | grep -oE 'openwrt-sdk-[^"<]*\.tar\.zst' | head -n1)
          echo "SDK: $base/$sdk"
          expected=$(curl -sf "$base/sha256sums" | awk -v f="*$sdk" '$2 == f {print $1}')
          [ -n "$expected" ] || { echo "no sha256 found for $sdk"; exit 1; }
          curl -sf -o sdk.tar.zst "$base/$sdk"
          echo "$expected  sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk
      - name: Install the package sources in the SDK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" packaging/openwrt/Makefile
          sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$(git rev-parse HEAD)/" packaging/openwrt/Makefile
          mkdir -p sdk/package/ycast-go/files
          cp packaging/openwrt/Makefile sdk/package/ycast-go/
          cp packaging/openwrt/files/* sdk/package/ycast-go/files/
      - name: Build the package
        run: |
          cd sdk
          ./scripts/feeds update packages
          ./scripts/feeds install golang
          echo 'CONFIG_PACKAGE_ycast-go=m' >> .config
          make defconfig
          make package/ycast-go/compile V=s
      - name: Collect the package
        run: |
          mkdir -p dist
          find sdk/bin/packages -name 'ycast-go*' -exec mv {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: openwrt-${{ matrix.version }}-${{ matrix.ext }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The image is built natively on each architecture runner (no QEMU, no
  # docker/* actions: those download tooling at run time and cannot be
  # verified statically), then the two per-arch images are merged into a
  # manifest list with `docker buildx imagetools` (bundled with docker on the
  # runners). ubuntu-24.04-arm is free for public repositories.
  docker-amd64:
    name: Docker image (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          repo=${GITHUB_REPOSITORY,,}
          tag="ghcr.io/${repo}:sha-${GITHUB_SHA:0:7}-amd64"
          docker build --build-arg VERSION="${VERSION}" -t "$tag" .
          # GHCR occasionally answers 500 mid-push: retry a few times.
          for i in 1 2 3; do docker push "$tag" && break || sleep 15; done
          docker push "$tag" # fail for real if all retries failed
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          echo "ghcr.io/${repo}@$digest" > digest-amd64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: docker-amd64
          path: digest-amd64.txt

  docker-arm64:
    name: Docker image (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          repo=${GITHUB_REPOSITORY,,}
          tag="ghcr.io/${repo}:sha-${GITHUB_SHA:0:7}-arm64"
          docker build --build-arg VERSION="${VERSION}" -t "$tag" .
          # GHCR occasionally answers 500 mid-push: retry a few times.
          for i in 1 2 3; do docker push "$tag" && break || sleep 15; done
          docker push "$tag" # fail for real if all retries failed
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          echo "ghcr.io/${repo}@$digest" > digest-arm64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: docker-arm64
          path: digest-arm64.txt

  docker-manifest:
    name: Docker manifest list (GHCR)
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (node24)
        with:
          path: digests
          merge-multiple: true
      - name: Compute version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VMINOR=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1-2)" >> "$GITHUB_ENV"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Create and push the manifest list
        run: |
          repo=${GITHUB_REPOSITORY,,}
          docker buildx imagetools create \
            -t "ghcr.io/${repo}:${VERSION}" \
            -t "ghcr.io/${repo}:${VMINOR}" \
            -t "ghcr.io/${repo}:latest" \
            "$(cat digests/digest-amd64.txt)" "$(cat digests/digest-arm64.txt)"
          docker buildx imagetools inspect "ghcr.io/${repo}:${VERSION}"

  release:
    name: Publish release
    needs: [binaries, deb, rpm, openwrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (node24)
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # no checkout in this job: gh needs the repo hint
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            artifacts/*.deb artifacts/*.rpm artifacts/ycast-go-linux-* \
            artifacts/*.ipk artifacts/*.apk
